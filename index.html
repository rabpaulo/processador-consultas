<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f2ed">
  <meta name="color-scheme" content="light">
  <title>Processador de Consultas · BD_Vendas</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%231c2128'/><text x='50%' y='55%' dominant-baseline='central' text-anchor='middle' font-family='monospace' font-size='56' font-weight='bold' fill='%23f4f2ed'>⋈</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>

  <!-- Cabeçalho: identidade, exemplos e ações -->
  <header class="appbar">
    <a class="brand" href="/" aria-label="Processador de Consultas">
      <span class="brand-mark" aria-hidden="true">⋈</span>
      <span class="brand-text">
        <span class="brand-name">Processador de Consultas</span>
        <span class="brand-sub">Banco de Dados II · Entrega final · 27/10</span>
      </span>
    </a>

    <div class="appbar-actions">
      <label class="example-picker">
        <span>Exemplo</span>
        <select id="example" class="example-select" aria-label="Carregar exemplo de consulta SQL"></select>
      </label>
      <button id="export" class="btn" disabled title="Exportar resultado estruturado em JSON (Ctrl+S)">
        Exportar JSON <kbd>Ctrl+S</kbd>
      </button>
      <button id="run" class="btn btn-primary" title="Executar consulta SQL (Ctrl+Enter)">
        <span class="btn-icon" aria-hidden="true">▶</span>
        <span>Executar</span>
        <kbd>Ctrl+Enter</kbd>
      </button>
    </div>
  </header>

  <div class="workspace">

    <!-- Coluna de entrada: editor e catálogo -->
    <aside class="query-pane" aria-label="Consulta e catálogo">

      <section class="card editor-card" aria-label="Editor de consulta SQL">
        <header class="card-head">
          <h2 class="card-title">Consulta SQL</h2>
        </header>

        <label class="sr-only" for="sql">Consulta SQL</label>
        <textarea id="sql" spellcheck="false" aria-describedby="sql-help" placeholder="Escreva sua consulta SQL aqui. Ex: SELECT p.Nome, c.Descricao FROM Produto p INNER JOIN Categoria c ON p.Categoria_idCategoria = c.idCategoria WHERE p.Preco > 200"></textarea>

        <div class="editor-foot">
          <div id="sql-help" class="syntax-tokens" aria-label="Sintaxe reconhecida">
            <span class="syntax-token">SELECT</span>
            <span class="syntax-token">FROM</span>
            <span class="syntax-token">INNER JOIN … ON</span>
            <span class="syntax-token">WHERE</span>
            <span class="syntax-token">AND</span>
          </div>
          <div id="status" class="status" role="status" aria-live="polite"></div>
        </div>
      </section>

      <!-- Erros de validação aparecem aqui, junto ao editor -->
      <div id="error" class="error-banner" role="alert" hidden></div>

      <section class="card catalog-card" aria-label="Catálogo do banco de dados">
        <header class="card-head">
          <h2 class="card-title">Catálogo BD_Vendas</h2>
          <span class="count-chip" id="catalog-count">10 tabelas</span>
        </header>
        <nav id="table-nav" class="table-list" aria-label="Tabelas do catálogo BD_Vendas"></nav>
      </section>
    </aside>

    <!-- Coluna de saída: etapas do pipeline e inspeção -->
    <main class="stage">

      <nav class="pipeline" aria-label="Etapas do processamento">
        <div class="tabs" role="tablist" aria-label="Visualizações do processador">
          <button id="tab-parser" role="tab" aria-selected="false" aria-controls="panel" tabindex="-1" data-tab="parser">
            <span class="tab-index">1</span> Parser
          </button>
          <button id="tab-algebra" role="tab" aria-selected="false" aria-controls="panel" tabindex="-1" data-tab="algebra">
            <span class="tab-index">2</span> Álgebra
          </button>
          <button id="tab-graph" role="tab" aria-selected="true" aria-controls="panel" data-tab="graph">
            <span class="tab-index">3</span> Árvore
          </button>
          <button id="tab-heuristics" role="tab" aria-selected="false" aria-controls="panel" tabindex="-1" data-tab="heuristics">
            <span class="tab-index">4</span> Heurísticas
          </button>
          <button id="tab-plan" role="tab" aria-selected="false" aria-controls="panel" tabindex="-1" data-tab="plan">
            <span class="tab-index">5</span> Plano
          </button>
          <button id="tab-results" role="tab" aria-selected="false" aria-controls="panel" tabindex="-1" data-tab="results">
            <span class="tab-index">6</span> Resultado
          </button>
          <span class="tab-sep" aria-hidden="true"></span>
          <button id="tab-schema" role="tab" aria-selected="false" aria-controls="panel" tabindex="-1" data-tab="schema">
            Esquema
          </button>
          <button id="tab-deliveries" role="tab" aria-selected="false" aria-controls="panel" tabindex="-1" data-tab="deliveries">
            Requisitos
          </button>
        </div>
      </nav>

      <!-- Telemetria da consulta -->
      <section id="metrics" class="metrics" aria-label="Telemetria da consulta"></section>

      <section class="inspector">
        <div id="panel" class="panel" role="tabpanel" aria-labelledby="tab-graph" tabindex="0"></div>
      </section>

    </main>
  </div>

  <footer class="statusbar">
    <span>Motor Python sem dependências externas · BD_Vendas</span>
    <span class="op-legend" aria-label="Convenção dos operadores">
      <span class="op-chip op-badge-proj">π Projeção</span>
      <span class="op-chip op-badge-sel">σ Seleção</span>
      <span class="op-chip op-badge-join">⋈ Junção</span>
      <span class="op-chip op-badge-prod">× Produto</span>
      <span class="op-chip op-badge-scan">▤ Varredura</span>
    </span>
  </footer>

</body>
</html>
